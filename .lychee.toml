# Link check settings shared by every repository (links.yml writes this file when a repository
# has none). Keep the exclusions short and explain each one: a link that is excluded is a link
# nobody checks.

# Re-check a link at most once a day; the cache is kept between workflow runs.
cache = true
max_cache_age = "1d"
cache_exclude_status = "429, 500.."

max_concurrency = 8
max_retries = 3
timeout = 20

# Anchors (#section) in Markdown and HTML files must exist, so README buttons and the table of
# contents cannot point at a renamed heading.
include_fragments = "anchor-only"

# 403/429 from rate limiting are not broken links; everything else outside 2xx is.
accept = ["200..=299", "403", "429"]

exclude_loopback = true
exclude_private = true
exclude_link_local = true

exclude = [
  # Sites that answer automated requests with 999 or a sign-in wall.
  '^https://(www\.)?linkedin\.com/',
  '^https://(www\.)?x\.com/',
  # Placeholder hosts used in code samples.
  '^https?://(www\.)?example\.(com|org|net)',
  '^https?://api\.example\.com',
  # Pull request and comparison pages that only exist after a push.
  '^https://github\.com/[^/]+/[^/]+/compare/',
  # The language selector links the nine README translations, which are written in the next
  # step (see CONTRIBUTING.md). Remove this line together with "i18nStrict": false in
  # .github/brand.json when they land.
  'README\.(tr|zh-CN|ja|ko|es|de|fr|pt-BR|ru)\.md$',
  # Release files are uploaded by the release workflow after the tag is pushed, so links to the
  # next version's binaries cannot resolve on the pull request that adds them.
  '^https://github\.com/muhittincamdali/sizeledger/releases/download/',
  # CHANGELOG.md links a version's release page in the pull request that adds the section, before
  # the tag exists.
  '^https://github\.com/muhittincamdali/sizeledger/releases/tag/',
]

exclude_path = [
  "node_modules",
  ".build",
  "build",
  "Pods",
  # Fixture build output (local only) and generated report snapshots, which hold no links.
  "Fixtures/.build",
  "Fixtures/snapshots",
]
